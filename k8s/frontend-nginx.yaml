# Frontend nginx config: serves the vite-built SPA bundle at /.
# Backend lives on the same pod at :8000; /api/v1/* is reverse-proxied
# here too so the browser sees a single origin (avoids CORS preflight).
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx
  namespace: burdello
data:
  default.conf: |
    server {
      listen 3000;
      server_name _;

      root /usr/share/nginx/html;
      index index.html;

      location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
      }

      location / {
        try_files $uri $uri/ /index.html;
      }
    }