apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: burdello
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      imagePullSecrets:
        - name: forgejo-registry
      containers:
        - name: worker
          image: forgejo.tail5d39b4.ts.net/jakub/burdello-bum-bum:latest
          command:
            - celery
            - -A
            - backend.pipeline.celery_app.celery_app
            - worker
            - -Q
            - celery
            - --loglevel=info
            - --concurrency=2
          envFrom:
            - configMapRef:
                name: burdello-env
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: burdello-secrets
                  key: DATABASE_URL
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: burdello-secrets
                  key: LITELLM_API_KEY
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 4Gi
