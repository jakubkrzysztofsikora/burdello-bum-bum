apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: burdello
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-studio
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: burdello
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: ankane/pgvector:latest
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: bbuser
            - name: POSTGRES_DB
              value: burdello
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: burdello-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "bbuser", "-d", "burdello"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: burdello
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432