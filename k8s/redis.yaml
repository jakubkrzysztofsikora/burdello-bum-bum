apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: burdello
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-studio
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: burdello
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - redis-server
            - --maxmemory
            - "0"
            - --maxmemory-policy
            - "noeviction"
            - --save
            - ""
            - --activedefrag
            - "yes"
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 4Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: burdello
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379