# Secrets stub. Real values are injected out-of-band:
#
#   kubectl -n burdello create secret generic burdello-secrets \
#     --from-literal=DATABASE_PASSWORD='<pw>' \
#     --from-literal=LITELLM_API_KEY='<key>' \
#     --from-literal=POSTGRES_PASSWORD='<pw>'
#
# Image-pull secrets live alongside:
#
#   kubectl -n burdello create secret docker-registry forgejo-registry \
#     --docker-server=forgejo.tail5d39b4.ts.net \
#     --docker-username=jakub \
#     --docker-password='<forgejo-pw>'
#
# Tailscale funnel sidecar auth key:
#
#   kubectl -n burdello create secret generic ts-sidecar-auth \
#     --from-literal=TS_AUTHKEY='<key>'
---
apiVersion: v1
kind: Secret
metadata:
  name: burdello-secrets
  namespace: burdello
type: Opaque
stringData: {}